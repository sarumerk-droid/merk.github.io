<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#050605" />
<title>Lily bouquet</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050605}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#11160f 0,#080a08 43%,#030403 78%)}main{width:min(100vw,88vh);height:min(100vh,112vw);display:grid;place-items:center}canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 0 32px #8c6d2822)}
</style>
</head>
<body>
<main><canvas id="bouquet" role="img" aria-label="A bouquet of colorful ASCII lilies with green stems, leaves, and a ribbon"></canvas></main>
<script>
const canvas=document.getElementById('bouquet');
let progress=0;
function draw(reveal=progress,motion=0){
 const box=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');if(!box.width)return;
 canvas.width=box.width*d;canvas.height=box.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,box.width,box.height);ctx.save();ctx.beginPath();ctx.rect(0,box.height*(1-reveal),box.width,box.height*reveal);ctx.clip();
 const N=92,cell=box.width/N,step=box.height/N,chars='.:;+=*x%#@',rand=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
 ctx.font=`${Math.max(7,Math.min(11,cell*1.12))}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 const blooms=[
  {x:25,y:23,r:20,c:[245,190,69]},{x:43,y:21,r:21,c:[233,62,70]},
  {x:34,y:35,r:24,c:[226,111,195]},{x:18,y:39,r:18,c:[239,226,205]},
  {x:52,y:37,r:18,c:[198,86,166]}
 ];
 const green=['#315d35','#46833e','#6eaa4f','#a2c95d'];
 // Long stems gather into a tied bunch below the overlapping flowers.
 function stem(x0,y0,x1,y1,color){ctx.strokeStyle=color;ctx.lineWidth=Math.max(2.5,cell*.42);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0*cell+cell/2,y0*step);ctx.quadraticCurveTo((x0+x1)/2*cell+cell/2,(y0+y1)/2*step,x1*cell+cell/2,y1*step);ctx.stroke();for(let t=.24;t<.94;t+=.1){const x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;ctx.fillStyle=rand(x0,t)>.65?'#a5c95c':color;ctx.fillText(rand(x0,t)>.55?'|':':',x*cell+cell/2,y*step+step/2)}}
 blooms.forEach((b,i)=>stem(b.x,b.y+b.r*.72,34+(i%3-1)*1.8,74,green[i%green.length]));
 // Pointed leaves fan out from the stems, with fine ASCII veins.
 const leaves=[{x:32,y:51,dx:-17,dy:-10},{x:36,y:52,dx:17,dy:-12},{x:32,y:57,dx:-19,dy:-7},{x:36,y:59,dx:19,dy:-9},{x:32,y:64,dx:-17,dy:-5},{x:36,y:65,dx:17,dy:-7},{x:33,y:48,dx:-13,dy:-12},{x:35,y:49,dx:13,dy:-13}];
 leaves.forEach((l,i)=>{const ex=l.x+l.dx,ey=l.y+l.dy,color=green[i%4];ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,cell*.3);ctx.beginPath();ctx.moveTo(l.x*cell+cell/2,l.y*step);ctx.quadraticCurveTo((l.x+ex)/2*cell+cell/2,(l.y+ey)/2*step-2,ex*cell+cell/2,ey*step);ctx.stroke();for(let t=.12;t<.96;t+=.075){const x=l.x+(ex-l.x)*t,y=l.y+(ey-l.y)*t,spread=Math.sin(t*Math.PI)*1.45;ctx.fillStyle=green[(i+1)%4];ctx.fillText(i%2?'/':'\\',(x+spread)*cell+cell/2,y*step+step/2);ctx.fillText(i%2?'\\':'/',(x-spread)*cell+cell/2,y*step+step/2);if(t<.9){ctx.fillStyle='#b0d56b';ctx.fillText('·',x*cell+cell/2,y*step+step/2)}}});
 // Each flower has six overlapping tepals, shaded from velvety edges to a raised ridge.
 blooms.forEach((b,bi)=>{
  const petals=Array.from({length:6},(_,i)=>({a:i*60-90+(bi%2?12:0),i}));
  for(let y=Math.max(2,Math.floor(b.y-b.r-1));y<Math.min(N,Math.ceil(b.y+b.r+1));y++)for(let x=Math.max(2,Math.floor(b.x-b.r-1));x<Math.min(N,Math.ceil(b.x+b.r+1));x++){
   let best=null,depth=-2;
   petals.forEach(p=>{const a=p.a*Math.PI/180,dx=x-b.x,dy=y-b.y,u=(dx*Math.cos(a)+dy*Math.sin(a))/b.r;if(u<-.03||u>1.04)return;const flex=motion?Math.sin(motion/1250+bi*1.3+p.i*1.15)*.045*u:0,v=(-dx*Math.sin(a)+dy*Math.cos(a))/b.r-flex,width=.255*Math.pow(Math.max(0,Math.sin(Math.PI*Math.min(.999,Math.max(.001,u)))),.72)+.018;if(Math.abs(v)>width)return;const z=u+(p.i%2)*.015;if(z>depth){depth=z;best={u,v,p:p.i,width}}});
   if(!best)continue;const [r,g,bl]=b.c,{u,v,p,width}=best,n=rand(x+bi*17,y),ridge=Math.exp(-Math.pow(v/(width*.27),2)),edge=Math.min(1,Math.abs(v)/width),baseShade=Math.exp(-u*12)*.3,vein=Math.exp(-Math.pow((v-.018*Math.sin(u*12))/(width*.12),2));
   // Rich petal gradients: ink-dark edges and bases, saturated midtones, bright raised ribs.
   const shade=.48+.43*ridge-.34*edge+.19*Math.sin(u*Math.PI)-baseShade+(n-.5)*.12+vein*.08;
   const petalTone=[.88,.98,1.08,1.14,1.02,.91][p],rr=Math.max(0,Math.min(255,r*shade*petalTone+vein*18)),gg=Math.max(0,Math.min(255,g*shade*(1+(p-2.5)*.012)+vein*13)),bb=Math.max(0,Math.min(255,bl*shade*(2-p*.035)+vein*10));
   if(n>.94&&u>.35){ctx.fillStyle=n>.985?'#f5dfb4':'#754339';ctx.globalAlpha=n>.985?.72:.68}else{ctx.fillStyle=`rgb(${rr|0} ${gg|0} ${bb|0})`;ctx.globalAlpha=1}
   ctx.shadowColor=`rgba(${r},${g},${bl},.58)`;ctx.shadowBlur=ridge>.72?5:1;
   const outline=edge>.84||u<.07||u>.97;
   if(outline){ctx.shadowBlur=0;ctx.globalAlpha=.94;ctx.fillStyle=edge>.9?(v<0?`rgb(${Math.min(255,r*1.15)|0} ${Math.min(255,g*1.15)|0} ${Math.min(255,bl*1.15)|0})`:`rgb(${r*.42|0} ${g*.42|0} ${bl*.42|0})`):`rgb(${r*.62|0} ${g*.62|0} ${bl*.62|0})`;ctx.fillText(u>.97?'^':(u<.07?(v<0?'(' : ')'):(v<0?'/':'\\')),x*cell+cell/2,y*step+step/2)}
   else ctx.fillText(chars[Math.floor(rand(x+bi*5,y)*chars.length)],x*cell+cell/2,y*step+step/2);
   ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  // Pollen stamens make the top-facing flower centers easy to recognize.
  for(let k=0;k<6;k++){const a=k*Math.PI/3-.18;for(let t=1.8;t<5.4;t+=.48){const bend=Math.sin(t/5.4*Math.PI)*.5,xx=b.x+Math.cos(a)*t-Math.sin(a)*bend,yy=b.y+Math.sin(a)*t+Math.cos(a)*bend;ctx.fillStyle=t>4.4?'#edbd58':(rand(k,t)>.5?'#9d552e':'#563225');ctx.shadowColor=t>4.4?'#ffcc67':'#a74629';ctx.shadowBlur=t>4.4?4:1;ctx.fillText(t>4.4?'*':(rand(t,k)>.5?'|':':'),xx*cell+cell/2,yy*step+step/2)}}ctx.shadowBlur=0;
  for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if(xx*xx+yy*yy<2){ctx.fillStyle=(xx+yy)%2?'#32251e':'#4b3021';ctx.fillText((xx+yy)%2?'.':'*',(b.x+xx*.65)*cell+cell/2,(b.y+yy*.65)*step+step/2)}
 });
 // A little ribbon gathers the stems; cut ends flow into an overgrown root mass.
 const tieY=72;ctx.fillStyle='#d3bd79';for(let x=27;x<=42;x++)ctx.fillText(x%2?'=':'-',x*cell+cell/2,tieY*step+step/2);ctx.fillText('<',26*cell+cell/2,tieY*step+step/2);ctx.fillText('>',43*cell+cell/2,tieY*step+step/2);ctx.fillText('◆',34.5*cell+cell/2,(tieY-1)*step+step/2);ctx.fillText('◆',34.5*cell+cell/2,(tieY+1)*step+step/2);
 for(let i=0;i<9;i++){ctx.fillStyle=green[i%green.length];ctx.fillText(i%2?'|':'!',(29+i*1.35)*cell+cell/2,(74+i%2)*step+step/2);ctx.fillText(i%2?'|':'!',(29+i*1.35)*cell+cell/2,(76+i%2)*step+step/2)}
 const roots=['#75613b','#917849','#5f7040','#a48a54'];
 function root(x0,y0,x1,y1,bend,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x0*cell+cell/2,y0*step);ctx.quadraticCurveTo((x0+x1)/2*cell+cell/2+bend*cell,(y0+y1)/2*step,x1*cell+cell/2,y1*step);ctx.stroke();for(let t=.08;t<.97;t+=.075){const x=x0+(x1-x0)*t+bend*Math.sin(t*Math.PI),y=y0+(y1-y0)*t;ctx.fillStyle=color;ctx.fillText(rand(x0,t)>.53?'/':(rand(t,y0)>.5?'~':'.'),x*cell+cell/2,y*step+step/2)}}
 for(let i=0;i<13;i++){const start=31+i*.62,end=8+(i*13)%54,finish=82+(i%6),bend=((i%5)-2)*2.6,color=roots[i%roots.length];root(start,77,end,finish,bend,color,i%4===0?1.25:.8);if(i%2===0){const mid=(start+end)/2;root(mid,82+(i%3),Math.max(5,Math.min(76,end+(i%3-1)*10)),87+(i%4),bend*.6,roots[(i+1)%roots.length],.65)}}
 // Tiny root hairs and soil-like flecks finish the tangled lower silhouette.
 for(let i=0;i<95;i++){const x=6+rand(i,2)*70,y=78+rand(i,5)*12;ctx.fillStyle=roots[i%roots.length];ctx.fillText(['.',';',"'",'~'][i%4],x*cell+cell/2,y*step+step/2)}
 for(let y=3;y<90;y++)for(let x=3;x<79;x++)if(rand(x*7,y*3)>.997){ctx.fillStyle='#ddd9bf';ctx.fillText(rand(x,y)>.5?'.':':',x*cell+cell/2,y*step+step/2)}
 ctx.restore();
}
new ResizeObserver(()=>draw()).observe(canvas);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){progress=1;draw(1)}else{const start=performance.now(),duration=7200;let lastSway=0;function sway(now){if(now-lastSway>40){draw(1,now-start);lastSway=now}requestAnimationFrame(sway)}function grow(now){progress=Math.min(1,(now-start)/duration);draw(progress);if(progress<1)requestAnimationFrame(grow);else requestAnimationFrame(sway)}requestAnimationFrame(grow)}
</script>
</body>
</html>
